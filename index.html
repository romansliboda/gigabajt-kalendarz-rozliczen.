<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gigabajt — Kalendarz rozliczeń</title><style>
:root{font-family:system-ui,-apple-system,Arial,sans-serif;color:#243347;background:#f7f9fb}*{box-sizing:border-box}body{margin:0;padding:12px}.app{max-width:560px;margin:auto;background:white;border:1px solid #d9e0e8;border-radius:18px;padding:14px}h1{font-size:20px;margin:4px 0 15px}h2{font-size:17px;text-align:center;margin:10px 0}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}.weekday{text-align:center;color:#64748b;font-size:12px;padding:5px 0}.day{aspect-ratio:1;border:1px solid #d5dce5;border-radius:9px;background:white;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:1px 0;min-width:0;color:#182739;cursor:pointer}.day .money{font-size:clamp(8px,2.3vw,11px);color:#2176a8;font-weight:700;min-height:12px;white-space:nowrap}.day .date{font-size:16px}.day .icons{height:17px;display:flex;justify-content:center;align-items:center}.day.start{background:#fff2d2}.day.trip,.day.end{background:#e2f2e9}.day.vacation{background:#efe9fa}.day.selected{outline:2px solid #287db8}.legend{display:flex;gap:18px;align-items:center;margin:14px 0;font-size:14px}.symbol{display:inline-flex;align-items:center;justify-content:center;font-size:16px;line-height:1}.truck{color:#227eb9}.house{color:#278854}.symbol svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.day .symbol svg{width:17px;height:17px}.panel{border:1px solid #d9e0e8;border-radius:14px;padding:14px;margin:14px 0}.panel h3{margin:0 0 15px;font-size:19px}.choice{display:flex;gap:9px;align-items:center;margin:14px 0;font-size:16px}.choice input{accent-color:#222;width:19px;height:19px}label.field{display:block;font-size:14px;margin:14px 0 6px}input[type=text],input[type=number]{width:100%;border:1px solid #9ca3af;border-radius:12px;padding:13px;font-size:17px;background:white;color:#243347}button{cursor:pointer;font:inherit}.btn{border:1px solid #227eb9;border-radius:11px;padding:12px;background:#227eb9;color:white;width:100%;margin-top:10px}.btn.danger{color:#b91c1c;border-color:#efb1b1;background:white}.btn.secondary{background:white;color:#243347;border-color:#cbd5e1}.head{display:flex;justify-content:space-between;align-items:center;gap:8px}.head button{border:0;background:transparent;font-size:24px;color:#64748b}.settings{width:100%;border:0;border-radius:10px;background:#f1f5f9;text-align:left;padding:14px;font-weight:650;margin:8px 0}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{border:1px solid #d5dce5;border-radius:12px;background:white;padding:16px 8px;min-height:88px}.tile.active{border:2px solid #278854}.muted{font-size:13px;color:#64748b}.total{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:650;margin:15px 0}.total strong{color:#20834c;font-size:21px;white-space:nowrap}.error{color:#b91c1c;font-size:13px}.hint{color:#64748b;font-size:12px;margin-top:10px}.printhead{display:none}@media print{body{padding:0;background:white}.app{max-width:none;border:0}.no-print,.panel,.settings{display:none!important}.printhead{display:block}.day{break-inside:avoid}.calendar{max-width:700px}.day .money{font-size:12px}.day .date{font-size:18px}.day{height:75px;aspect-ratio:auto}.report{display:block!important}h1{font-size:24px}}.report{display:none}.report table{border-collapse:collapse;width:100%;font-size:12px}.report td,.report th{border:1px solid #ccc;padding:5px;text-align:left}
</style><link rel="stylesheet" href="gb-dodatki.css?v=2.4.0"></head><body><header id="gbHeader" class="gb-header no-print"><div class="gb-illustration" aria-hidden="true"></div><div class="gb-title"><div class="gb-logo">GB <span>▦</span></div><div id="gbSubTitle">Kalendarz rozliczeń</div></div><div class="gb-actions"><div class="gb-clock" id="gbClock"><b id="gbTime">--:--</b><small id="gbDate">--.--.----</small></div><button class="gb-gear" id="gbGear" type="button">⚙<small id="gbSettingsLabel">Ustawienia</small></button></div></header><section id="gbAppSettings" class="gb-options no-print" hidden></section><main class="app"><h1>Gigabajt — Kalendarz rozliczeń</h1><h2 id="month"></h2><div id="calendar" class="calendar"></div><div class="legend"><span><span class="symbol truck" id="legendTruck"></span> W trasie</span><span><span class="symbol house" id="legendHouse"></span> W domu</span></div><div id="editor" class="panel no-print" hidden></div><hr class="no-print"><button class="settings no-print" id="settingsButton">⚙ Ustawienia rozliczenia <span style="float:right">⌄</span></button><div id="settingsBody" class="panel no-print" hidden></div><hr><div class="total"><span>Razem za miesiąc</span><strong id="total">0,00 zł</strong></div><button class="btn secondary no-print" id="pdf">▤ Zapisz w PDF</button><p class="hint no-print">Dane zapisują się w przeglądarce tego telefonu. Każdy dzień oznaczasz ręcznie. Eksport PDF korzysta z opcji „Zapisz jako PDF” w drukowaniu.</p><section class="report" id="report"></section></main><script>
const truck='<span class="symbol truck"><svg viewBox="0 0 24 24"><path d="M3 5h12v12H3zM15 9h4l3 4v4h-7z"/><circle cx="7.5" cy="18" r="2"/><circle cx="18" cy="18" r="2"/></svg></span>';
const house='<span class="symbol house"><svg viewBox="0 0 24 24"><path d="m3 11 9-8 9 8v10H3zM9 21v-8h6v8"/></svg></span>';
const monthDate=new Date();let year=monthDate.getFullYear(),month=monthDate.getMonth();const monthNames=['stycznia','lutego','marca','kwietnia','maja','czerwca','lipca','sierpnia','września','października','listopada','grudnia'];
// Pierwszy test pozostaje w październiku 2026, zgodnie z zatwierdzonym kalendarzem.
year=2026;month=9;
const storageKey='gigabajt-rozliczenia-web-v1';let state={days:{},system:'daily',rate:'500',vacationRate:'190',kmRate:'0,80',mode:'hours'};try{const saved=JSON.parse(localStorage.getItem(storageKey)||'null');if(saved&&typeof saved==='object')state={...state,...saved}}catch(e){};
let selected=null,settingsPage='closed';const $=id=>document.getElementById(id),get=d=>state.days[d]||{kind:'empty'};const num=v=>Number(String(v??'').replace(',','.'));const valid=v=>String(v??'').trim()!==''&&Number.isFinite(num(v))&&num(v)>=0;const fmt=v=>v.toLocaleString('pl-PL',{minimumFractionDigits:2,maximumFractionDigits:2});const minutes=t=>{let a=(t||'00:00').split(':').map(Number);return a[0]*60+a[1]};const daysInMonth=new Date(year,month+1,0).getDate();function persist(){localStorage.setItem(storageKey,JSON.stringify(state))}
function pairs(){let start=null,out={};for(let d=1;d<=daysInMonth;d++){let v=get(d);if(v.kind==='start'&&valid(v.reading))start={day:d,reading:num(v.reading)};else if(v.kind==='end'&&start&&valid(v.reading)){let km=num(v.reading)-start.reading;if(km>=0)out[d]={from:start.day,km,pay:km*(valid(state.kmRate)?num(state.kmRate):0)};start=null}}return out}
function earning(d,p=pairs()){let v=get(d);if(v.kind==='vacation')return valid(v.vacAmount)?num(v.vacAmount):0;if(state.system==='km')return p[d]?.pay||0;let r=valid(state.rate)?num(state.rate):0;if(v.kind==='trip')return r;if(v.kind==='start')return ['start','both'].includes(state.mode)?r:r*(1440-minutes(v.time))/1440;if(v.kind==='end')return ['end','both'].includes(state.mode)?r:r*minutes(v.time)/1440;return 0}
function iconFor(k){return k==='start'?house+truck:k==='trip'?truck:k==='end'?truck+house:k==='home'||k==='vacation'?house:''}
function render(){let p=pairs(),html='';for(let w of ['Pn','Wt','Śr','Cz','Pt','So','Nd'])html+=`<div class="weekday">${w}</div>`;let offset=(new Date(year,month,1).getDay()+6)%7;for(let i=0;i<offset;i++)html+='<div></div>';for(let d=1;d<=daysInMonth;d++){let v=get(d),pay=earning(d,p);html+=`<button class="day ${v.kind} ${selected===d?'selected':''}" data-day="${d}"><span class="money">${pay>0?Math.round(pay)+' zł':''}</span><span class="date">${d}</span><span class="icons">${iconFor(v.kind)}</span></button>`} $('calendar').innerHTML=html;document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>openDay(+b.dataset.day));$('month').textContent='Październik 2026';$('total').textContent=fmt(Array.from({length:daysInMonth},(_,i)=>earning(i+1,p)).reduce((a,b)=>a+b,0))+' zł';$('legendTruck').innerHTML=truck;$('legendHouse').innerHTML=house;renderReport(p)}
const options=[['start',house+truck,'Wyjazd w trasę'],['trip',truck,'W trasie / pracuję'],['end',truck+house,'Powrót do domu'],['home',house,'Pobyt w domu'],['vacation',house,'Urlop płatny']];function openDay(d){selected=d;let v=get(d);$('editor').hidden=false;$('editor').innerHTML=`<div class="head"><h3>${d} ${monthNames[month]}</h3><button id="closeEditor">×</button></div><p>Wybierz oznaczenie tego dnia:</p>${options.map(([k,ico,t])=>`<label class="choice"><input type="radio" name="kind" value="${k}" ${v.kind===k?'checked':''}>${ico} ${t}</label>`).join('')}<div id="extra"></div><p id="err" class="error"></p><button class="btn" id="saveDay">Zatwierdź dzień</button>${v.kind!=='empty'?'<button class="btn danger" id="removeDay">Usuń dane dnia</button>':''}`;document.querySelectorAll('input[name=kind]').forEach(x=>x.onchange=showExtra);$('closeEditor').onclick=()=>{selected=null;$('editor').hidden=true;render()};$('saveDay').onclick=saveDay;if($('removeDay'))$('removeDay').onclick=()=>{delete state.days[selected];persist();selected=null;$('editor').hidden=true;render()};showExtra();render()}
function showExtra(){let kind=document.querySelector('input[name=kind]:checked')?.value||'empty',v=get(selected),x='';if(kind==='start'||kind==='end'){if(state.system==='km')x=`<label class="field">${kind==='start'?'Początkowy':'Końcowy'} stan licznika (km)</label><input id="entry" type="number" inputmode="decimal" enterkeyhint="done" value="${v.reading||''}" placeholder="Np. 125000">`;else x=`<label class="field">${kind==='start'?'Godzina wyjazdu':'Godzina powrotu'} (HH:MM)</label><input id="entry" type="text" inputmode="numeric" enterkeyhint="done" value="${v.time||(kind==='end'?'18:00':'06:00')}" placeholder="06:00">`}if(kind==='vacation')x=`<label class="field">Ile masz płacone za jeden dzień urlopu? (zł)</label><input id="entry" type="text" inputmode="decimal" enterkeyhint="done" value="${v.kind==='vacation'?v.vacAmount:state.vacationRate}" placeholder="Np. 200">`;$('extra').innerHTML=x;const entry=$('entry');if(entry){if((kind==='start'||kind==='end')&&state.system!=='km'){
entry.setAttribute('maxlength','5');entry.setAttribute('autocomplete','off');
entry.addEventListener('focus',()=>{requestAnimationFrame(()=>{try{entry.setSelectionRange(0,entry.value.length)}catch(e){}})});
entry.addEventListener('input',()=>{const old=entry.value;const digits=old.replace(/\D/g,'').slice(0,4);entry.value=digits.length>2?digits.slice(0,2)+':'+digits.slice(2):digits;});
entry.addEventListener('blur',()=>{let digits=entry.value.replace(/\D/g,'');if(digits.length===4)entry.value=digits.slice(0,2)+':'+digits.slice(2)});
}entry.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();saveDay()}})}}
function saveDay(){let kind=document.querySelector('input[name=kind]:checked')?.value||'empty',v=get(selected),entry=$('entry')?.value||'',next={kind,time:v.time||'',reading:v.reading||'',vacAmount:v.vacAmount};if(['start','end'].includes(kind)){if(state.system==='km'){if(!valid(entry))return $('err').textContent='Wpisz poprawny stan licznika.';next.reading=entry}else{if(!/^([01]\d|2[0-3]):[0-5]\d$/.test(entry))return $('err').textContent='Wpisz poprawną godzinę HH:MM.';next.time=entry}}if(kind==='vacation'){if(!valid(entry))return $('err').textContent='Wpisz poprawną kwotę urlopu.';next.vacAmount=entry}state.days[selected]=next;persist();selected=null;$('editor').hidden=true;render()}
$('settingsButton').onclick=()=>{settingsPage=settingsPage==='closed'?'menu':'closed';renderSettings()};function renderSettings(){let el=$('settingsBody');el.hidden=settingsPage==='closed';if(el.hidden)return;if(settingsPage==='menu'){el.innerHTML=`<p>Wybierz sposób rozliczania:</p><div class="choices"><button class="tile ${state.system==='daily'?'active':''}" data-page="daily">▦<br>Dniówki ${state.system==='daily'?'✓':''}</button><button class="tile ${state.system==='km'?'active':''}" data-page="km">♧<br>Kilometrówka ${state.system==='km'?'✓':''}</button></div>`;el.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{settingsPage=b.dataset.page;renderSettings()});return}let daily=settingsPage==='daily';el.innerHTML=`<button class="btn secondary" id="back">← Wróć</button><h3>Ustawienia ${daily?'dniówki':'kilometrówki'}</h3><label class="choice"><input type="checkbox" id="active" ${state.system===settingsPage?'checked':''}> Rozliczaj mnie w systemie ${daily?'dniówek':'kilometrówki'}</label>${daily?`<label class="field">Dniówka (zł)</label><input id="rate" type="text" inputmode="decimal" enterkeyhint="done" value="${state.rate}"><label class="field">Stawka urlopowa — domyślna (zł)</label><input id="vacationRate" type="text" inputmode="decimal" enterkeyhint="done" value="${state.vacationRate}"><label class="field">Sposób naliczania wyjazdu i powrotu</label>${[['hours','Wyjazd i powrót według godzin'],['start','Wyjazd pełny, powrót według godzin'],['end','Wyjazd według godzin, powrót pełny'],['both','Wyjazd i powrót — pełne dniówki']].map(([v,t])=>`<label class="choice"><input type="radio" name="mode" value="${v}" ${state.mode===v?'checked':''}>${t}</label>`).join('')}`:`<label class="field">Stawka za kilometr (zł/km)</label><input id="kmRate" type="text" inputmode="decimal" enterkeyhint="done" value="${state.kmRate}"><p class="muted">Stan licznika wpisujesz w dniu wyjazdu i powrotu.</p>`}<p id="settingsErr" class="error"></p><button class="btn" id="saveSettings">Zapisz i zamknij</button>`;$('back').onclick=()=>{settingsPage='menu';renderSettings()};$('active').onchange=e=>{if(e.target.checked){state.system=settingsPage;persist();render()}};$('saveSettings').onclick=saveSettings;el.querySelectorAll('input:not([type=radio]):not([type=checkbox])').forEach(i=>i.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();saveSettings()}})}
function saveSettings(){let keys=settingsPage==='daily'?['rate','vacationRate']:['kmRate'];for(let k of keys){let value=$(k).value;if(!valid(value))return $('settingsErr').textContent='Wpisz poprawną stawkę.';state[k]=value}if(settingsPage==='daily')state.mode=document.querySelector('input[name=mode]:checked').value;persist();settingsPage='closed';renderSettings();render()}
const labels={start:'Wyjazd w trasę',trip:'W trasie',end:'Powrót do domu',home:'Pobyt w domu',vacation:'Urlop płatny'};function renderReport(p){let rows='';for(let d=1;d<=daysInMonth;d++){let v=get(d);if(v.kind==='empty')continue;let detail=v.kind==='vacation'?`Urlop: ${fmt(num(v.vacAmount)||0)} zł`:state.system==='km'?(v.reading?`Licznik: ${v.reading} km`:'')+(p[d]?` | Przebieg: ${p[d].km} km`:''):(v.kind==='start'||v.kind==='end'?`Godzina: ${v.time}`:'');rows+=`<tr><td>${d}.10.2026</td><td>${labels[v.kind]}</td><td>${detail}</td><td>${fmt(earning(d,p))} zł</td></tr>`}$('report').innerHTML=`<h3>Zestawienie miesięczne — ${state.system==='daily'?'dniówki':'kilometrówka'}</h3><table><thead><tr><th>Data</th><th>Oznaczenie</th><th>Szczegóły</th><th>Kwota</th></tr></thead><tbody>${rows||'<tr><td colspan="4">Brak wpisów</td></tr>'}</tbody></table>`}
$('pdf').onclick=()=>window.print();render();
</script><script src="gb-dodatki.js?v=2.4.0"></script></body></html>
